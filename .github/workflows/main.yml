name: quality checks

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
        paths:
            - src/**.ts
            - package.json
            - tsconfig.json
            - .github/workflows/**.yml

# Required for xseman/coverage to comment on PRs (uses Issues API)
permissions:
    contents: read
    pull-requests: write
    issues: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'yarn'

            - name: install
              run: yarn

            - name: build
              run: yarn run build

            - name: test
              run: yarn run test:ci

            # Skip on fork PRs: GITHUB_TOKEN cannot comment on PRs from forks
            - name: Coverage report
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              uses: xseman/coverage@v0.2.0
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                coverage-artifact-paths: |
                    lcov:coverage/lcov.info

    # Every merge on main is published on npm, so a PR must bump the version.
    # The bump is pushed automatically on same-repo PRs, forks must do it by hand.
    version:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}

            - name: bump version if needed
              env:
                  BASE_REF: ${{ github.base_ref }}
                  CAN_PUSH: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
              run: |
                  git fetch --depth=1 origin "$BASE_REF"
                  base_version=$(git show FETCH_HEAD:package.json | jq -r .version)
                  head_version=$(jq -r .version package.json)

                  if npx --yes semver@7 --include-prerelease --range ">$base_version" "$head_version" > /dev/null; then
                      echo "Version already bumped from $base_version to $head_version"
                      exit 0
                  fi

                  if [ "$CAN_PUSH" != "true" ]; then
                      echo "::error file=package.json,title=Version not bumped::package.json version is $head_version, it must be greater than the one on $BASE_REF ($base_version). Merging on $BASE_REF publishes the package on npm, bump the version with: yarn version --no-git-tag-version --new-version <version>"
                      exit 1
                  fi

                  # 1.0.0-alpha.72 -> 1.0.0-alpha.73
                  new_version=$(npx --yes semver@7 --increment prerelease "$base_version")
                  npm pkg set version="$new_version"

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -am "chore: bump version to $new_version"
                  git push

                  echo "Version bumped from $base_version to $new_version"

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: install
              run: yarn

            - name: lint
              run: yarn
