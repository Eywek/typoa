name: publish

on:
    push:
        branches:
            - main

permissions:
    contents: read

# Publish one merge at a time, in order
concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        # Forks have no npm token
        if: github.repository == 'Eywek/typoa'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'yarn'
                  registry-url: 'https://registry.npmjs.org'

            - name: install
              run: yarn --frozen-lockfile

            - name: build
              run: yarn run build

            - name: test
              run: yarn run test

            # Versions are prereleases (1.0.0-alpha.x) published under `latest`,
            # recent npm versions refuse a prerelease without an explicit tag
            - name: publish
              run: npm publish --tag latest
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
